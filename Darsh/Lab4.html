<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=>, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form align="center">
        <table align="center">
            <h1 align="center">Student Registration</h1> 
            <tr>
                <td><label>FullName</Label></td>
                <td><input type="text"  required minlength="5"></td>
            </tr>
            <tr>
                <td><Label>Emai</Label></td>
                <td><input type="email"></td>
            </tr>
            <tr>
                <td><Label>Mobile No</Label></td>
                <td><input type="tel" pattern="[0-9]{10}"></td>
            </tr>
            <tr>
                <td><Label>Address</Label></td>
                <td><textarea></textarea></td>
            </tr>
            <tr>
                <td>Nationality</td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td>Date of Birth</td>
                <td><input type="date"></td>
            </tr>
            <tr>
                <td>Gender</td>
                <td><input type="radio" id="Male" name="gender" value="Male"></td>
                <td><label for="male">Male</label></td>
                <td><input type="radio" id="Female" name="gender" value="Female"></td>
                <td><label for="female">Female</label></td>
            </tr>
            <tr>
                <td><label for="degree">Highest Degree</label></td>
                <td>
                    <select id="degree" name="degree">
                        <option selected disabled>Select Degree</option>
                        <option>B.Tech CSE</option>
                        <option>M.Tech CSE</option>
                        <option>BCA</option>
                        <option>MCA</option>
                    </select>

                </td>
            </tr>
            <tr>
                <td><Label>CPI</Label></td>
                <td><input type="number" min="1" max="10"></td>
            </tr>
            <tr>
                <td><Label>University</Label></td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td>Passing Year</td>
                <td> <select id="Year" name="year">
                        <option selected disabled>Select Year</option>
                        <option>2026</option>
                        <option>2027</option>
                        <option>2028</option>
                        <option>2029</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><button type="Submit">Submit</button></td>
                <td><button type="Reset">Cancel</button></td>
            </tr>
        </table>
    </form>


          
    
    <form align="center">
         <table align="center">
            <h1>COVID-19 Vaccine Registration Form</h1>
          <tr>
                <td><Label >FullName</Label></td>
                <td><input type="text" Maxlength="18" Minlength="6" required ></td>
            </tr>
            <tr>
                <td><Label>LastName</Label></td>
                <td><input type="text"></td>
            </tr>
             <tr>
                <td><Label>Aadhar Number</Label></td>
                <td><input type="tel"></td>
            </tr>
            <tr>
                <td>Vaccine Name</td>
                <td>
                    <select id="Name" name="Name">
                        <option selected disabled>Please Select Vaccine Name</option>
                        <option>Covaccine</option>
                        <option>Covishild</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Vaccine Center Name</td>
                <td>
                    <select id="Name" name="Name">
                        <option selected disabled>Please Select Vaccine Center Name</option>
                        <option>Baroda</option>
                        <option>Rajkot</option>
                        <option>Ahmedabad</option>
                        <option>Jamnagar</option>
                        <option>Amreli</option>
                        <option>Junagadh</option>
            <tr>
                <td>Date of Dose</td>
                <td><input type="date" ></td>
            </tr>
            <tr>
                <td><Label>Dose Number</Label></td>
                <td><input type="number" min="2"></td>
            </tr>
            <tr>
                <td><button type="submit">Click Here</button></td>
                <td><button type="Reset">Cancel</button></td>
            </tr>

        </table>
        
    </form>
</body>

</html>
